name: Apply Book Creator title sanitizer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-title-sanitizer.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch title cleaning safely
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('studio-v2.html')
          s = p.read_text(encoding='utf-8')
          old = "function cleanTitle(raw){return String(raw||'').trim().replace(/^```(?:text|markdown)?/i,'').replace(/```$/,'').split(/\\r?\\n/).map(x=>x.trim()).find(Boolean)?.replace(/^\\s*[-•>#]+\\s*/,'').replace(/^\\*{1,3}|\\*{1,3}$/g,'').replace(/^(?:suggested\\s+)?(?:book\\s+)?title\\s*[:\\-–—]\\s*/i,'').replace(/^[`\"'“”‘’*_~#\\s]+|[`\"'“”‘’*_~#\\s]+$/g,'').trim().slice(0,60)||'Untitled Book'}"
          new = """function cleanTitle(raw){
            let value=raw;
            if(value&&typeof value==='object')value=value.title??value.name??'';
            let s=String(value??'').trim();
            s=s.replace(/^```(?:json|text|markdown)?\\s*/i,'').replace(/```\\s*$/,'').trim();
            if((s.startsWith('{')&&s.endsWith('}'))||(s.startsWith('[')&&s.endsWith(']'))){
              try{const parsed=JSON.parse(s);if(parsed&&typeof parsed==='object'){const candidate=Array.isArray(parsed)?parsed[0]:(parsed.title??parsed.name);if(candidate!=null)s=String(candidate).trim()}}catch(e){}
            }
            const inlineJson=s.match(/^\\s*\\{[\\s\\S]*?[\\\"']title[\\\"']\\s*:\\s*[\\\"']([\\s\\S]*?)[\\\"']\\s*[,}]\\s*$/i);
            if(inlineJson)s=inlineJson[1];
            s=(s.split(/\\r?\\n/).map(x=>x.trim()).find(Boolean)||'')
              .replace(/^\\s*[-•>#]+\\s*/,'')
              .replace(/^\\*{1,3}|\\*{1,3}$/g,'')
              .replace(/^(?:suggested\\s+)?(?:book\\s+)?title\\s*[:\\-–—]\\s*/i,'')
              .replace(/^[`\\\"'“”‘’*_~#\\s]+|[`\\\"'“”‘’*_~#\\s]+$/g,'')
              .trim();
            return s.slice(0,60)||'Untitled Book';
          }"""
          if old not in s:
              raise SystemExit('Expected cleanTitle signature not found; refusing unsafe patch')
          s = s.replace(old, new, 1)
          old_save = "draft.title=$('book-title').value.trim()||'Untitled Book';"
          new_save = "draft.title=cleanTitle($('book-title').value);$('book-title').value=draft.title;"
          if old_save not in s:
              raise SystemExit('Expected save-title signature not found; refusing unsafe patch')
          s = s.replace(old_save, new_save, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit title sanitizer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add studio-v2.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: sanitize generated and saved book titles"
          git push
