name: Test and Build Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'
        cache-dependency-path: backend/requirements.txt

    - name: Install backend dependencies
      run: pip install -r backend/requirements.txt

    - name: Sanity-import the backend app and v2 extensions
      working-directory: backend
      env:
        MONGO_URL: "mongodb://localhost:27017/ci_dummy"
      run: |
        python -c "import server; print('server.py imports cleanly')"
        python -c "import app_v2; print('app_v2.py imports cleanly')"
        python -m py_compile server.py app_v2.py

    - name: Smoke-test generic brand blueprint parser
      working-directory: backend
      env:
        MONGO_URL: "mongodb://localhost:27017/ci_dummy"
      run: |
        python - <<'PY'
        import app_v2
        text = app_v2._extract_document_text(
            b"Brand voice: warm, playful and precise. Never alter established character colours.",
            "brand-bible.txt",
            "text/plain",
        )
        assert "Never alter established character colours" in text
        print("Brand blueprint parser smoke test passed")
        PY
