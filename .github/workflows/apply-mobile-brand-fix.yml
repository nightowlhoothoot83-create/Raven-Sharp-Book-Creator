name: Apply mobile brand fix

on:
  push:
    paths:
      - '.github/workflows/apply-mobile-brand-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore mobile brand lockup and transparent raven
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          s = s.replace('.brand small{display:none}', '.brand small{display:block}')
          s = s.replace('/brands/ravenCentre-v3.jpg', '/brands/ravenCentre.png')
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name "Raven Sharp QA"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: restore Book Creator mobile branding"
          git push
